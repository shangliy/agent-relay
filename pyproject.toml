[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay"
version = "0.1.0"
description = "Non-profit agent task relay: fixed task specs, local execution, non-withdrawable credits."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agent-relay-server = "relay.__main__:main"
agent-relay-worker = "agent_relay_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["relay*", "agent_relay_worker*"]

[tool.setuptools.package-data]
relay = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
