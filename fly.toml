# Single machine on purpose: SQLite on one volume + in-memory rate limits.
app = "agent-relay-pilot"
primary_region = "sjc"

[build]

[env]
  RELAY_DB = "/data/relay.db"
  RELAY_TRUST_PROXY = "1"
  RELAY_PUBLIC_URL = "https://agent-relay-pilot.fly.dev"

[mounts]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
